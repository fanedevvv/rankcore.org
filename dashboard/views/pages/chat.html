<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Roco AI</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--ac:#ff3737;--ac2:rgba(255,55,55,.1);--bd:rgba(255,255,255,.05);--b:#0c0c10;--b2:#111116;--b3:#16161e;--tx:#eeeef2;--tx2:#5c5c78;--tx3:#8a8aa8;--red:#f87171;--sw:260px;--th:44px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--b);color:var(--tx);display:flex;flex-direction:column;height:100vh;font-family:'Inter',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
::selection{background:rgba(255,55,55,.25)}
::-webkit-scrollbar{width:2px}
::-webkit-scrollbar-thumb{background:transparent}

/* ── Topbar ──────────────────────────────────────────────── */
.tp{height:var(--th);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 8px;gap:4px;border-bottom:1px solid var(--bd)}
.tp-l{display:flex;align-items:center;gap:3px}
.mtb{display:none;background:none;border:none;color:var(--tx2);cursor:pointer;padding:6px;border-radius:6px;font-size:20px;line-height:1;min-width:36px;min-height:36px}
.mtb:hover{color:var(--tx)}
.tp-b{display:flex;align-items:center;gap:5px;color:var(--tx2);font-size:13px;font-weight:600;text-decoration:none;padding:6px 12px;border-radius:6px;border:1px solid var(--bd)}
.tp-b:hover{color:var(--tx);border-color:rgba(255,255,255,.08);background:var(--b2)}
.tp-brand{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--tx)}
.tp-brand svg{flex-shrink:0}
.badge{background:var(--ac2);color:var(--ac);font-size:8px;font-weight:700;padding:1px 4px;border-radius:99px}
.tp-r{display:flex;align-items:center;gap:4px}
#uc{display:flex;align-items:center;gap:3px;padding:1px 7px;border-radius:99px;background:var(--b2);border:1px solid var(--bd);font-size:10px;font-weight:600;color:var(--tx3)}
.ua{width:12px;height:12px;border-radius:50%;overflow:hidden;flex-shrink:0;display:grid;place-items:center;background:var(--b3)}
.ua img{width:100%;height:100%;object-fit:cover}
.un{max-width:50px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stp{display:flex;align-items:center;gap:3px;background:var(--b2);border:1px solid var(--bd);border-radius:99px;padding:1px 7px;font-size:9px;color:var(--tx2);font-family:'JetBrains Mono',monospace}
.sd{width:3px;height:3px;border-radius:50%;flex-shrink:0;background:rgba(255,55,55,.5);animation:pu 2s infinite}
.sd.off{background:var(--red);opacity:.7;animation:none}
.sd.busy{background:#f59e0b;animation:none}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}
.nc{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--ac);color:#000;border:none;padding:10px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;width:100%;margin-bottom:4px}

/* ── Layout ──────────────────────────────────────────────── */
.ly{flex:1;display:flex;min-height:0;overflow:hidden}

/* ── Sidebar ─────────────────────────────────────────────── */
.side{width:var(--sw);flex-shrink:0;border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0;background:var(--b)}
.side-h{padding:6px;flex-shrink:0}
#ssearch{width:100%;background:var(--b2);border:1px solid var(--bd);border-radius:6px;padding:7px 10px;font-size:12px;color:var(--tx);font-family:inherit;outline:none}
#ssearch:focus{border-color:rgba(255,55,55,.35)}
#ssearch::placeholder{color:var(--tx2)}
.sl{flex:1;overflow-y:auto;padding:2px 6px 6px}
.sempty{padding:16px 8px;color:var(--tx2);font-size:12px;text-align:center;line-height:1.5}
.sitem{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:6px;cursor:pointer;margin-bottom:2px}
.sitem:hover{background:var(--b2)}
.sitem.active{background:var(--ac2)}
.si{width:15px;height:15px;border-radius:4px;display:grid;place-items:center;flex-shrink:0;color:var(--tx2)}
.sitem.active .si{color:var(--ac)}
.sinfo{flex:1;min-width:0}
.st{font-size:11px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitem.active .st{color:var(--ac)}
.sp{font-size:9px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sa{display:none;flex-shrink:0;gap:1px}
.sitem:hover .sa{display:flex}
.sab{background:none;border:none;color:var(--tx2);cursor:pointer;padding:6px;border-radius:5px;display:grid;place-items:center}
.sab.rn:hover{color:var(--tx3)}
.sab.dl:hover{color:var(--red)}
.sri{background:var(--b3);border:1px solid rgba(255,55,55,.35);color:var(--tx);font-size:11px;font-family:inherit;padding:0 4px;border-radius:3px;width:100%;outline:none}

/* ── Main chat ───────────────────────────────────────────── */
.cm{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
.wl{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;text-align:center;padding:20px;color:var(--tx2)}
.wl p{font-size:12px}

#ca{display:none;flex:1;flex-direction:column;min-height:0}
#msgs{flex:1;overflow-y:auto;padding:0;display:flex;flex-direction:column}
#msgs:empty{padding:0}

/* ── Messages ────────────────────────────────────────────── */
.msg{display:flex;gap:7px;padding:4px 14px;animation:fi .13s ease both}
.msg + .msg{padding-top:0}
.msg.bot + .msg.bot,.msg.user + .msg.user{margin-top:-1px}
@keyframes fi{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.msg.user{flex-direction:row-reverse}
.av{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;overflow:hidden;margin-top:2px;font-size:0}
.av.bot{background:var(--b3);color:var(--tx3);border:1px solid var(--bd)}
.av.user{background:var(--b3);border:1px solid var(--bd)}
.av img{width:100%;height:100%;object-fit:cover}

.txt{max-width:72%;padding:4px 11px;border-radius:8px;font-size:13px;line-height:1.55;word-break:break-word}
.msg.bot .txt{background:#15151c;border-top-left-radius:3px}
.msg.user .txt{background:var(--ac2);border-top-right-radius:3px}
.txt p{margin-bottom:4px}.txt p:last-child{margin:0}
.txt strong{color:var(--tx);font-weight:700}
.txt em{color:var(--tx3)}
.txt code{background:rgba(255,255,255,.06);padding:1px 5px;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#ff8a8a}
.txt pre{background:#0d0d12;border:1px solid var(--bd);border-radius:6px;padding:8px 10px;overflow-x:auto;margin:5px 0}
.txt pre code{background:none;padding:0;font-size:11px;color:#7dd3fc}
.txt ul,.txt ol{margin:4px 0 4px 18px}
.txt li{margin-bottom:1px}
.txt h1,.txt h2,.txt h3{margin:5px 0 3px;font-weight:700;color:var(--tx)}
.txt h1{font-size:15px}.txt h2{font-size:14px}.txt h3{font-size:13px}
.txt a{color:var(--ac);text-decoration:underline;text-underline-offset:2px}

/* ── Empty state ─────────────────────────────────────────── */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:24px 20px;animation:fi .2s ease both}
.empty-av{width:34px;height:34px;border-radius:50%;overflow:hidden;border:1.5px solid var(--ac2);background:var(--ac2);display:grid;place-items:center;flex-shrink:0}
.empty-av img{width:100%;height:100%;object-fit:cover}
.empty-body h2{font-size:15px;font-weight:700;margin-bottom:2px}
.empty-body .gr{color:var(--ac)}
.empty-body p{font-size:12px;color:var(--tx2);max-width:250px;line-height:1.5;margin:0 auto}
.hints{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:100%;max-width:280px}
.hint{display:flex;align-items:center;gap:5px;background:var(--b2);border:1px solid var(--bd);border-radius:6px;padding:5px 9px;cursor:pointer;text-align:left;font-family:inherit}
.hint:hover{border-color:rgba(255,55,55,.22);background:var(--ac2)}
.hi{font-size:13px;flex-shrink:0}
.ht{font-size:11px;font-weight:600;color:var(--tx3);line-height:1.3}

/* ── Typing indicator ────────────────────────────────────── */
.msg.typing .txt{padding:7px 11px}
.dots{display:flex;gap:3px;align-items:center;margin-bottom:2px}
.dot{width:3px;height:3px;background:var(--tx2);border-radius:50%;animation:db 1.1s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.16s}
.dot:nth-child(3){animation-delay:.32s}
@keyframes db{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-3px)}}
.lbl{font-size:9px;color:var(--tx2);font-family:'JetBrains Mono',monospace;display:block}

/* ── Cursor ──────────────────────────────────────────────── */
.cursor{display:inline-block;width:1.5px;height:.8em;background:var(--ac);margin-left:1px;vertical-align:middle;border-radius:1px;animation:bl .6s step-end infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:0}}

/* ── Input area ──────────────────────────────────────────── */
.in{flex-shrink:0;padding:0 14px 8px;border-top:1px solid var(--bd)}
.in-w{background:var(--b2);border:1px solid var(--bd);border-radius:10px;padding:5px 5px 5px 12px;display:flex;align-items:flex-end;gap:4px}
.in-w:focus-within{border-color:var(--ac2)}
.in-r{display:contents}
#ui{flex:1;background:transparent;border:none;outline:none;color:var(--tx);font-family:inherit;font-size:14px;resize:none;max-height:100px;line-height:1.5;scrollbar-width:thin}
#ui::placeholder{color:var(--tx2)}
.snd{width:38px;height:38px;border-radius:8px;flex-shrink:0;background:var(--ac);border:none;cursor:pointer;display:grid;place-items:center;transition:opacity .12s}
.snd:disabled{opacity:.25;cursor:not-allowed}
.snd svg{fill:#000;width:17px;height:17px}
.snd:not(:disabled):hover{opacity:.85}

.if{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 0;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--tx2)}
#if-l{display:flex;align-items:center;gap:5px}
#cc{color:rgba(255,55,55,.5);font-size:8px}
#cb{background:none;border:none;color:var(--tx2);font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;padding:4px 6px}

/* ── Toast ───────────────────────────────────────────────── */
#toast{position:fixed;bottom:3.5rem;left:50%;transform:translateX(-50%) translateY(8px);background:var(--b3);border:1px solid rgba(255,55,55,.18);color:var(--tx);padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;z-index:400;display:flex;align-items:center;gap:5px;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-color:rgba(248,113,113,.25)}
#toast.err .toast-icon{color:var(--red)}
.toast-icon{color:var(--ac);flex-shrink:0}

@media(max-width:700px){
  .mtb{display:flex}
  .side{position:fixed;top:var(--th);left:0;bottom:0;z-index:50;transform:translateX(-100%);transition:transform .15s;box-shadow:4px 0 20px rgba(0,0,0,.5);background:var(--b)}
  .side.open{transform:translateX(0)}
  .cm{width:100%}
  #msgs{padding:0 4px}
  .in{padding:0 8px 6px}
  .txt{max-width:88%}
  .msg{padding:3px 8px}
  .hints{grid-template-columns:1fr;max-width:100%}
  .un{display:none}
  .tp-b span{display:none}
  .stp{display:none}
}
</style>

<link rel="stylesheet" href="/loading.css">
<style>
@keyframes nx-spin     { to { transform: translate(-50%,-50%) rotate(360deg); } }
@keyframes nx-bar-move { 0%{margin-left:-40%} 100%{margin-left:140%} }
@keyframes nx-pulse    { 0%,100%{box-shadow:0 0 0 0 rgba(255,55,55,0)} 50%{box-shadow:0 0 0 8px rgba(255,55,55,.08)} }
@keyframes nx-dot      { 0%,80%,100%{transform:scale(.6);opacity:.4} 40%{transform:scale(1.2);opacity:1} }
</style>
  <link rel="stylesheet" href="/mobile.css?v=2">
</head>
<body>
<div id="nx-loader" style="position:fixed;inset:0;z-index:999999;background:#0c0c10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .35s ease,visibility .35s ease">
  <div style="position:fixed;top:0;left:0;right:0;height:3px;background:rgba(255,55,55,.1)"><div style="height:100%;width:40%;background:linear-gradient(90deg,#CC2222,#FF3737,#FF5555);animation:nx-bar-move 1.4s ease-in-out infinite;border-radius:0 2px 2px 0"></div></div>
  <div style="position:relative;width:80px;height:80px;display:flex;align-items:center;justify-content:center">
    <div style="width:50px;height:50px;border-radius:14px;background:rgba(255,55,55,.1);border:1px solid rgba(255,55,55,.2);display:flex;align-items:center;justify-content:center;animation:nx-pulse 2s ease-in-out infinite">
      <img src="/logo.png" style="width:28px;height:28px;object-fit:contain" onerror="this.style.display='none'">
    </div>
    <div style="position:absolute;top:50%;left:50%;width:50px;height:50px;border-radius:50%;border:3px solid rgba(255,55,55,.12);border-top-color:#FF3737;animation:nx-spin .75s linear infinite;transform:translate(-50%,-50%)"></div>
  </div>
  <div style="font-size:12px;font-weight:600;letter-spacing:.04em;color:rgba(255,255,255,.25);font-family:system-ui,sans-serif;display:flex;align-items:center">Loading<span style="display:inline-flex;gap:2px;margin-left:3px"><span style="width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.25);animation:nx-dot 1.2s ease-in-out infinite;display:inline-block"></span><span style="width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.25);animation:nx-dot 1.2s ease-in-out .15s infinite;display:inline-block"></span><span style="width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.25);animation:nx-dot 1.2s ease-in-out .3s infinite;display:inline-block"></span></span></div>
</div>
<script>
(function(){function h(){var l=document.getElementById('nx-loader');if(!l)return;l.style.opacity='0';l.style.visibility='hidden';setTimeout(function(){if(l.parentNode)l.parentNode.removeChild(l);},300);}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){setTimeout(h,80);})}else{setTimeout(h,80);}setTimeout(h,1500);})();
</script>
<script src="/loading.js" defer></script>

<header class="tp">
  <div class="tp-l">
    <button class="mtb" onclick="toggleMobileSidebar()" aria-label="Toggle sidebar">☰</button>
    <a href="/servers" class="tp-b">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      <span>Dashboard</span>
    </a>
    <div class="tp-brand">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      Roco AI
      <span class="badge">BETA</span>
    </div>
  </div>
  <div class="tp-r">
    <div id="uc"></div>
    <div class="stp"><div class="sd" id="sd"></div><span id="st">connecting…</span></div>
  </div>
</header>

<div class="ly">
  <aside class="side" id="side">
    <div class="side-h">
      <button class="nc" onclick="newConversation()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Chat
      </button>
      <input id="ssearch" type="text" placeholder="Search chats…" oninput="filterConvs()" autocomplete="off"/>
    </div>
    <div class="sl" id="slist">
      <div class="sempty">Loading…</div>
    </div>
  </aside>

  <main class="cm">
    <div class="wl" id="wl">
      <p>Select a conversation or start a new chat</p>
    </div>

    <div id="ca">
      <div id="msgs"></div>

      <div class="in">
        <div class="in-w">
          <div class="in-r">
            <textarea id="ui" placeholder="Message Roco AI…" rows="1" aria-label="Chat input"></textarea>
            <button class="snd" id="snd" disabled aria-label="Send">
              <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
          </div>
        </div>
        <div class="if">
          <div id="if-l">
            <span id="ml">Powered by Groq</span>
            <span id="cc"></span>
          </div>
          <button id="cb">clear</button>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="toast" role="alert" aria-live="polite">
  <span class="toast-icon"></span>
  <span class="toast-text"></span>
</div>

<script type="module" src="/js/chatmain.js"></script>
</body>
</html>
