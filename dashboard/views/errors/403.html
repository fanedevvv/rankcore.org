<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 | Access Denied — RankCore</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tailwind.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --red: #FF5555; --red-dim: rgba(255,85,85,0.1);
      --bg: #07080f; --surface: #0d0f1c; --surface-2: #131629;
      --border: rgba(255,255,255,0.055); --border-hover: rgba(255,255,255,0.1);
      --text-muted: #4a5068; --text-dim: #7a849a; --text: #c8cfe0; --text-bright: #edf0f8;
    }
    html, body { margin:0;padding:0;height:100%; }
    body { background:var(--bg);color:var(--text);font-family:'Instrument Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden; }
    body::before { content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:0.5; }
    .font-display { font-family:'Syne',sans-serif; }
    .glow-red { position:fixed;width:600px;height:600px;top:50%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(ellipse,rgba(255,85,85,0.07) 0%,transparent 70%);pointer-events:none;z-index:0;animation:pulse 6s ease-in-out infinite; }
    .glow-green { position:fixed;width:400px;height:400px;bottom:-100px;right:-100px;background:radial-gradient(ellipse,rgba(255,51,51,0.04) 0%,transparent 70%);pointer-events:none;z-index:0; }
    @keyframes pulse { 0%,100%{opacity:1;transform:translate(-50%,-50%) scale(1)} 50%{opacity:0.6;transform:translate(-50%,-50%) scale(1.15)} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
    @keyframes scanline { 0%{top:-4px} 100%{top:100%} }
    .card { position:relative;z-index:10;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:52px 48px;max-width:460px;width:calc(100% - 32px);text-align:center;animation:fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) both;box-shadow:0 0 0 1px rgba(255,85,85,0.06),0 32px 64px rgba(0,0,0,0.5); }
    .card::before { content:'';position:absolute;inset:0;border-radius:24px;background:linear-gradient(135deg,rgba(255,85,85,0.04) 0%,transparent 60%);pointer-events:none; }
    .icon-wrap { position:relative;width:72px;height:72px;margin:0 auto 28px;border-radius:18px;background:var(--red-dim);border:1px solid rgba(255,85,85,0.2);display:flex;align-items:center;justify-content:center;overflow:hidden; }
    .icon-wrap::after { content:'';position:absolute;left:0;right:0;height:4px;background:linear-gradient(transparent,rgba(255,85,85,0.4),transparent);animation:scanline 2.5s linear infinite; }
    .error-code { font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--red);background:rgba(255,85,85,0.08);border:1px solid rgba(255,85,85,0.18);border-radius:6px;padding:4px 12px;display:inline-block;margin-bottom:20px; }
    h1 { font-family:'Syne',sans-serif;font-size:30px;font-weight:800;color:var(--text-bright);margin:0 0 10px;line-height:1.2; }
    .desc { font-size:14px;color:var(--text-dim);line-height:1.65;margin:0 0 32px; }
    .divider { height:1px;background:var(--border);margin:0 0 28px; }
    .meta-row { display:flex;gap:12px;margin-bottom:28px;text-align:left; }
    .meta-item { flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px 16px; }
    .meta-label { font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:var(--text-muted);margin-bottom:4px; }
    .meta-value { font-size:13px;font-weight:600;color:var(--text); }
    .btn-primary { display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 20px;background:rgba(255,85,85,0.1);border:1px solid rgba(255,85,85,0.22);border-radius:12px;color:#ff8080;font-weight:600;font-size:14px;text-decoration:none;transition:all 0.15s;margin-bottom:10px;cursor:pointer; }
    .btn-primary:hover { background:rgba(255,85,85,0.18);border-color:rgba(255,85,85,0.4);transform:translateY(-1px); }
    .btn-secondary { display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 20px;background:transparent;border:1px solid var(--border);border-radius:12px;color:var(--text-dim);font-weight:600;font-size:14px;text-decoration:none;transition:all 0.15s;cursor:pointer; }
    .btn-secondary:hover { background:var(--surface-2);border-color:var(--border-hover);color:var(--text); }
  </style>

  <link rel="stylesheet" href="/loading.css">
  <style>
    @keyframes nx-spin     { to { transform: translate(-50%,-50%) rotate(360deg); } }
    @keyframes nx-bar-move { 0%{margin-left:-40%} 100%{margin-left:140%} }
    @keyframes nx-pulse    { 0%,100%{box-shadow:0 0 0 0 rgba(255,51,51,0)} 50%{box-shadow:0 0 0 8px rgba(255,51,51,.08)} }
    @keyframes nx-dot      { 0%,80%,100%{transform:scale(.6);opacity:.4} 40%{transform:scale(1.2);opacity:1} }
  </style>
  <link rel="stylesheet" href="/mobile.css?v=2">
</head>
<body>
<div id="nx-loader" style="position:fixed;inset:0;z-index:999999;background:#07080f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .35s ease,visibility .35s ease">
  <div style="position:fixed;top:0;left:0;right:0;height:3px;background:rgba(255,51,51,.1)"><div style="height:100%;width:40%;background:linear-gradient(90deg,#CC2222,#FF3333,#FF5555);animation:nx-bar-move 1.4s ease-in-out infinite;border-radius:0 2px 2px 0"></div></div>
  <div style="position:relative;width:80px;height:80px;display:flex;align-items:center;justify-content:center">
    <div style="width:50px;height:50px;border-radius:14px;background:rgba(255,51,51,.1);border:1px solid rgba(255,51,51,.2);display:flex;align-items:center;justify-content:center;animation:nx-pulse 2s ease-in-out infinite">
      <img src="/logo.png" style="width:28px;height:28px;object-fit:contain" onerror="this.style.display='none'">
    </div>
    <div style="position:absolute;top:50%;left:50%;width:50px;height:50px;border-radius:50%;border:3px solid rgba(255,51,51,.12);border-top-color:#FF3333;animation:nx-spin .75s linear infinite;transform:translate(-50%,-50%)"></div>
  </div>
  <div style="font-size:12px;font-weight:600;letter-spacing:.04em;color:rgba(255,255,255,.25);font-family:system-ui,sans-serif;display:flex;align-items:center">Loading<span style="display:inline-flex;gap:2px;margin-left:3px"><span style="width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.25);animation:nx-dot 1.2s ease-in-out infinite;display:inline-block"></span><span style="width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.25);animation:nx-dot 1.2s ease-in-out .15s infinite;display:inline-block"></span><span style="width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.25);animation:nx-dot 1.2s ease-in-out .3s infinite;display:inline-block"></span></span></div>
</div>
<script>
  (function(){
    function hide(){var l=document.getElementById('nx-loader');if(!l)return;l.style.opacity='0';l.style.visibility='hidden';setTimeout(function(){if(l.parentNode)l.parentNode.removeChild(l);},300);}
    if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){setTimeout(hide,80);});}else{setTimeout(hide,80);}
    setTimeout(hide, 1500);
  })();
</script>
<script src="/loading.js" defer></script>

  <div class="glow-red"></div>
  <div class="glow-green"></div>
  <div class="card">
    <div class="icon-wrap">
      <svg width="28" height="28" fill="none" stroke="#ff5555" stroke-width="1.75" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <div class="error-code">Error 403 &middot; Access Denied</div>
    <h1 class="font-display">You don't have permission</h1>
    <p class="desc">Your account doesn't have the required permissions to manage this server. You need <strong style="color:var(--text)">Manage Server</strong> or higher to use the RankCore dashboard for this guild.</p>
    <div class="divider"></div>
    <div class="meta-row">
      <div class="meta-item">
        <div class="meta-label">Status</div>
        <div class="meta-value" style="color:#ff8080;">Forbidden</div>
      </div>
      <div class="meta-item">
        <div class="meta-label">Required</div>
        <div class="meta-value">Manage Server</div>
      </div>
    </div>
    <a href="/servers" class="btn-primary">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Back to My Servers
    </a>
    <a href="/support" class="btn-secondary">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/></svg>
      Contact Support
    </a>
  </div>

</body>
</html>
