<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feature Unavailable | Under Maintenance</title>
  <link rel="icon" type="image/png" href="/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/tailwind.css">
  
  <script>
    const tailwind = window.tailwind || {}; tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: { 
            razor: "#8B5CF6",
            dark: "#070813"
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'pulse-glow': 'pulseGlow 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-20px)' },
            },
            pulseGlow: {
              '0%, 100%': { opacity: '0.4', transform: 'scale(1)' },
              '50%': { opacity: '0.8', transform: 'scale(1.1)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #050508;
      overflow: hidden;
    }
    .bg-grid {
      background-size: 40px 40px;
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
    }
    .text-glow {
      text-shadow: 0 0 40px rgba(108, 83, 255, 0.5);
    }
  </style>

  <link rel="stylesheet" href="/loading.css">
  <style>
    @keyframes nx-spin     { to { transform: translate(-50%,-50%) rotate(360deg); } }
    @keyframes nx-bar-move { 0%{margin-left:-40%} 100%{margin-left:140%} }
    @keyframes nx-pulse    { 0%,100%{box-shadow:0 0 0 0 rgba(139,92,246,0)} 50%{box-shadow:0 0 0 8px rgba(139,92,246,.08)} }
    @keyframes nx-dot      { 0%,80%,100%{transform:scale(.6);opacity:.4} 40%{transform:scale(1.2);opacity:1} }
  </style>
  <link rel="stylesheet" href="/mobile.css?v=2">
</head>

<body class="min-h-screen flex items-center justify-center relative">
<div id="nx-loader" style="position:fixed;inset:0;z-index:999999;background:#070813;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .35s ease,visibility .35s ease">
  <div style="position:fixed;top:0;left:0;right:0;height:3px;background:rgba(139,92,246,.1)"><div style="height:100%;width:40%;background:linear-gradient(90deg,#38D4FF,#8B5CF6,#E05CFF);animation:nx-bar-move 1.4s ease-in-out infinite;border-radius:0 2px 2px 0"></div></div>
  <div style="position:relative;width:80px;height:80px;display:flex;align-items:center;justify-content:center">
    <div style="width:50px;height:50px;border-radius:14px;background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.2);display:flex;align-items:center;justify-content:center;animation:nx-pulse 2s ease-in-out infinite">
      <img src="/logo.png" style="width:28px;height:28px;object-fit:contain" onerror="this.style.display='none'">
    </div>
    <div style="position:absolute;top:50%;left:50%;width:50px;height:50px;border-radius:50%;border:3px solid rgba(139,92,246,.12);border-top-color:#8B5CF6;animation:nx-spin .75s linear infinite;transform:translate(-50%,-50%)"></div>
  </div>
  <div style="font-size:12px;font-weight:600;letter-spacing:.04em;color:rgba(255,255,255,.25);font-family:system-ui,sans-serif;display:flex;align-items:center">Loading<span style="display:inline-flex;gap:2px;margin-left:3px"><span style="width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.25);animation:nx-dot 1.2s ease-in-out infinite;display:inline-block"></span><span style="width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.25);animation:nx-dot 1.2s ease-in-out .15s infinite;display:inline-block"></span><span style="width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.25);animation:nx-dot 1.2s ease-in-out .3s infinite;display:inline-block"></span></span></div>
</div>
<script>
  (function(){
    function hide(){var l=document.getElementById('nx-loader');if(!l)return;l.style.opacity='0';l.style.visibility='hidden';setTimeout(function(){if(l.parentNode)l.parentNode.removeChild(l);},300);}
    if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){setTimeout(hide,80);});}else{setTimeout(hide,80);}
    setTimeout(hide, 1500);
  })();
</script>
<script src="/loading.js" defer></script>


  <div class="fixed inset-0 bg-grid z-0"></div>
  <div class="fixed top-1/4 left-1/4 w-96 h-96 bg-razor/10 rounded-full blur-[150px] animate-pulse-glow"></div>
  <div class="fixed bottom-1/4 right-1/4 w-96 h-96 bg-blue-600/10 rounded-full blur-[150px] animate-pulse-glow" style="animation-delay: 2s;"></div>

  <div class="relative z-10 text-center px-6">
    
    <h1 class="text-[120px] md:text-[180px] font-black text-white leading-none tracking-tighter select-none animate-float relative group">
      <span class="absolute inset-0 text-razor blur-2xl opacity-50 group-hover:opacity-80 transition-opacity duration-500"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" style="display:inline-block;width:1em;height:1em;vertical-align:-0.125em;fill:currentColor;" aria-hidden="true"><path d="M256 32c14.2 0 27.3 7.5 34.5 19.8l216 368c7.3 12.4 7.3 27.7.2 40.1S486.3 480 472 480H40c-14.3 0-27.6-7.7-34.7-20.1s-7-27.8.2-40.1l216-368C228.7 39.5 241.8 32 256 32zm0 128c-13.3 0-24 10.7-24 24v112c0 13.3 10.7 24 24 24s24-10.7 24-24V184c0-13.3-10.7-24-24-24zm32 224a32 32 0 1 0-64 0 32 32 0 0 0 64 0z"/></svg></span>
      <span class="relative bg-gradient-to-b from-white to-gray-600 bg-clip-text text-transparent"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" style="display:inline-block;width:1em;height:1em;vertical-align:-0.125em;fill:currentColor;" aria-hidden="true"><path d="M256 32c14.2 0 27.3 7.5 34.5 19.8l216 368c7.3 12.4 7.3 27.7.2 40.1S486.3 480 472 480H40c-14.3 0-27.6-7.7-34.7-20.1s-7-27.8.2-40.1l216-368C228.7 39.5 241.8 32 256 32zm0 128c-13.3 0-24 10.7-24 24v112c0 13.3 10.7 24 24 24s24-10.7 24-24V184c0-13.3-10.7-24-24-24zm32 224a32 32 0 1 0-64 0 32 32 0 0 0 64 0z"/></svg></span>
    </h1>

    <h2 class="text-3xl font-bold text-white mb-4">Feature Unavailable</h2>
    <p class="text-gray-400 max-w-md mx-auto mb-10 text-lg" id="disabled-reason">
      This feature is currently disabled or undergoing maintenance. Please check back later or contact support if you need assistance.
    </p>

    <div class="flex flex-col sm:flex-row gap-4 justify-center">
      <!-- Back button goes to previous page -->
      <a href="javascript:void(0)" onclick="history.back()" class="group relative px-8 py-3.5 bg-white text-black rounded-xl font-bold transition-all hover:scale-105 active:scale-95">
        <div class="absolute inset-0 bg-razor rounded-xl blur-lg opacity-40 group-hover:opacity-60 transition-opacity"></div>
        <span class="relative flex items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
          </svg>
          Back
        </span>
      </a>

      <a href="/support" class="px-8 py-3.5 bg-white/5 text-white border border-white/10 rounded-xl font-bold hover:bg-white/10 transition-all hover:scale-105 active:scale-95">
        Contact Support
      </a>
    </div>

  </div>

  <div class="absolute top-10 left-10 text-gray-800 font-mono text-xs opacity-50">MAINTENANCE_MODE_ACTIVE</div>
  <div class="absolute bottom-10 right-10 text-gray-800 font-mono text-xs opacity-50">SYSTEM_PAUSED</div>

  <script>
    // Show custom reason if provided in the URL
    const params = new URLSearchParams(window.location.search);
    const reason = params.get("reason");
    if (reason) {
      const el = document.getElementById("disabled-reason");
      if (el) el.textContent = reason;
    }
  </script>


</body>
</html>
