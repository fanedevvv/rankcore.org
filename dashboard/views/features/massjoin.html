<style>
/* Custom Scrollbar */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: #0C0E1D; }
::-webkit-scrollbar-thumb { background: #2d2d3d; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #6C53FF; }

/* Toggle Switch */
.toggle-checkbox:checked { transform: translateX(100%); border-color: white; }
.toggle-checkbox:checked + .toggle-label { background-color: #6C53FF; }
.toggle-checkbox { right: auto; left: 2px; top: 2px; z-index: 10; border: none; transition: transform 0.3s ease-in-out; }
.toggle-label { width: 44px; height: 24px; border-radius: 9999px; background-color: #2b2b40; transition: background-color 0.3s ease-in-out; border: 1px solid rgba(255,255,255,0.1); }

/* Toast Notifications */
#toast { position: fixed; top: 1rem; right: 1rem; padding: 1rem 1.5rem; border-radius: 0.75rem; transform: translateX(400px); transition: transform 0.3s ease-in-out; z-index: 50; color: white; }
</style>

<style>
/* ═══════════════ Razor Custom Select ═══════════════ */
.rzr-wrap{position:relative;width:100%;display:block}
/* hide ::after chevrons on select-wrap parents */
.rzr-wrap-parent.select-wrap::after,
.rzr-wrap-parent::after{display:none!important;content:none!important}
.rzr-trigger{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:10px 14px;
  border-radius:10px;border:1.5px solid rgba(255,255,255,0.1);
  background:#0C0E1D;color:#fff;
  cursor:pointer;font-size:14px;font-family:inherit;
  min-height:44px;width:100%;
  transition:border-color .15s,box-shadow .15s;
  user-select:none;box-sizing:border-box;
}
.rzr-trigger:hover{border-color:rgba(255,255,255,0.22)}
.rzr-trigger.is-open{
  border-color:rgba(139,92,246,.6);
  box-shadow:0 0 0 3px rgba(139,92,246,.1);
}
.rzr-label{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.4}
.rzr-label.is-ph{color:#6b7280}
.rzr-chev{flex-shrink:0;color:#6b7280;display:flex;align-items:center;transition:transform .2s,color .2s}
.rzr-trigger.is-open .rzr-chev{transform:rotate(180deg);color:#8B5CF6}
/* panel is appended to body — these rules still apply via the class */
.rzr-panel{
  position:fixed;z-index:999999;
  background:rgba(11,11,20,.98);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1.5px solid rgba(255,255,255,0.12);border-radius:12px;
  box-shadow:0 24px 60px rgba(0,0,0,.7);
  overflow:hidden;
  animation:rzrIn .16s ease;
}
@keyframes rzrIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.rzr-panel-search{padding:8px 8px 6px;border-bottom:1px solid rgba(255,255,255,.07)}
.rzr-search-inp{
  display:block;width:100%;
  background:#070813;border:1px solid rgba(255,255,255,.09);
  border-radius:7px;padding:6px 11px;
  color:#fff;font-size:13px;font-family:inherit;
  outline:none;box-sizing:border-box;transition:border-color .15s;
}
.rzr-search-inp:focus{border-color:rgba(139,92,246,.45)}
.rzr-search-inp::placeholder{color:#374151}
.rzr-list{max-height:220px;overflow-y:auto;padding:5px}
.rzr-list::-webkit-scrollbar{width:4px}
.rzr-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:6px}
.rzr-list::-webkit-scrollbar-thumb:hover{background:#8B5CF6}
.rzr-item{
  display:flex;align-items:center;justify-content:space-between;
  gap:6px;padding:8px 11px;border-radius:8px;
  cursor:pointer;font-size:13px;color:#9ca3af;
  transition:background .1s,color .1s;
}
.rzr-item:hover{background:rgba(255,255,255,.055);color:#fff}
.rzr-item.is-sel{background:rgba(139,92,246,.13);color:#8B5CF6;font-weight:600}
.rzr-item-text{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rzr-item-chk{flex-shrink:0;font-size:11px;color:#8B5CF6;opacity:0}
.rzr-item.is-sel .rzr-item-chk{opacity:1}
.rzr-empty{padding:16px;text-align:center;color:#374151;font-size:13px}
/* ═══════════════ End Razor Custom Select ═══════════════ */
</style>

<script>
const guildId = location.pathname.split("/")[2];

// Toast helper
function showToast(msg, type = 'success') {
  const toast = document.getElementById('toast');
  const box = document.getElementById('toastMessage');
  box.innerText = msg;
  toast.style.backgroundColor = type === 'error' ? '#e74c3c' : '#6C53FF';
  toast.style.transform = 'translateX(0)';
  setTimeout(() => toast.style.transform = 'translateX(400px)', 3000);
}

// Render joins
function renderJoins(list) {
  const el = document.getElementById('joins');
  if(!list.length) el.innerHTML = `<p class="text-gray-400 text-sm">No recent joins</p>`;
  else el.innerHTML = list.map(j => `
    <div class="flex justify-between items-center bg-[#0C0E1D] p-3 rounded-xl border border-white/10">
      <span class="font-mono">${j.userId}</span>
      <span class="text-xs text-gray-400">${new Date(j.time).toLocaleTimeString()}</span>
    </div>
  `).join('');
}

// Initialize
async function init() {
  try {
    const res = await fetch(`/api/guild/${guildId}/massjoin`);
    const data = await res.json();

    document.getElementById('enabled').checked = data.isEnabled || false;
    document.getElementById('limit').value = data.massJoinLimit || 5;
    document.getElementById('timeLimit').value = data.timeLimit || 15;
    document.getElementById('punishment').value = data.punishment || 'kick';

    renderJoins(data.joins || []);
  } catch(err) {
    console.error(err);
    showToast("Failed to load data", "error");
  }
}

// Save config
async function saveConfig() {
  const res = await fetch(`/api/guild/${guildId}/massjoin/config`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      isEnabled: document.getElementById('enabled').checked,
      massJoinLimit: parseInt(document.getElementById('limit').value) || 5,
      timeLimit: parseInt(document.getElementById('timeLimit').value) || 15,
      punishment: document.getElementById('punishment').value
    })
  });
  if(res.ok) showToast("Configuration saved");
  else showToast("Failed to save", "error");
}

// Load on start
init();
</script>

<!-- Razor Custom Select JS -->
<script>
(function(){
'use strict';
var CHEV='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
var wrapped=new WeakSet();
var openWrap=null;

/* strip any html tags from option text just in case */
function cleanText(t){
  t=String(t||'');
  var d=document.createElement('div');
  d.innerHTML=t;
  return (d.textContent||d.innerText||'').trim();
}

/* get clean option text */
function optText(opt){
  return cleanText(opt.text||opt.textContent||opt.label||'');
}

/* position panel relative to trigger using fixed coords */
function positionPanel(wrap){
  var r=wrap._t.getBoundingClientRect();
  var p=wrap._p;
  var panelH=p.offsetHeight||240;
  var spaceBelow=window.innerHeight-r.bottom;
  var spaceAbove=r.top;
  var width=Math.max(r.width,160);
  p.style.width=width+'px';
  p.style.left=r.left+'px';
  p.style.right='auto';
  if(spaceBelow>=panelH||spaceBelow>=spaceAbove){
    p.style.top=(r.bottom+4)+'px';
    p.style.bottom='auto';
  } else {
    p.style.bottom=(window.innerHeight-r.top+4)+'px';
    p.style.top='auto';
  }
}

/* close on outside click */
document.addEventListener('mousedown',function(e){
  if(!openWrap)return;
  if(!openWrap._p.contains(e.target)&&!openWrap._t.contains(e.target))close_(openWrap);
},true);

/* close on scroll anywhere (reposition) */
window.addEventListener('scroll',function(){
  if(openWrap)positionPanel(openWrap);
},true);
window.addEventListener('resize',function(){
  if(openWrap)positionPanel(openWrap);
});

function open_(wrap){
  if(openWrap&&openWrap!==wrap)close_(openWrap);
  openWrap=wrap;
  buildList(wrap,'');
  wrap._si.value='';
  /* always show search */
  wrap._sw.style.display='';
  document.body.appendChild(wrap._p);
  wrap._p.style.display='block';
  wrap._t.classList.add('is-open');
  wrap._t.setAttribute('aria-expanded','true');
  /* position after display:block so offsetHeight is known */
  requestAnimationFrame(function(){positionPanel(wrap);});
  setTimeout(function(){if(openWrap===wrap)wrap._si.focus();},30);
}

function close_(wrap){
  if(!wrap)return;
  if(wrap._p.parentNode)wrap._p.parentNode.removeChild(wrap._p);
  wrap._p.style.display='none';
  wrap._t.classList.remove('is-open');
  wrap._t.setAttribute('aria-expanded','false');
  if(openWrap===wrap)openWrap=null;
}

function buildList(wrap,q){
  var sel=wrap._s,list=wrap._l,qlo=(q||'').toLowerCase();
  var opts=Array.from(sel.options).filter(function(o){
    var t=optText(o);
    return t&&(!qlo||t.toLowerCase().indexOf(qlo)>-1);
  });
  if(!opts.length){list.innerHTML='<div class="rzr-empty">No options found</div>';return;}
  list.innerHTML='';
  opts.forEach(function(opt){
    var it=document.createElement('div');
    it.className='rzr-item'+(opt.value===sel.value?' is-sel':'');
    it.dataset.v=opt.value;
    var tx=document.createElement('span');tx.className='rzr-item-text';tx.textContent=optText(opt);
    var ck=document.createElement('span');ck.className='rzr-item-chk';ck.textContent='✓';
    it.appendChild(tx);it.appendChild(ck);
    it.addEventListener('mousedown',function(e){
      e.preventDefault();e.stopPropagation();
      sel.value=opt.value;
      updateLabel(wrap);
      close_(wrap);
      sel.dispatchEvent(new Event('change',{bubbles:true}));
    });
    list.appendChild(it);
  });
}

function updateLabel(wrap){
  var sel=wrap._s,lbl=wrap._lb;
  var idx=sel.selectedIndex,opt=idx>=0?sel.options[idx]:null;
  var text=opt?optText(opt):'';
  if(text){
    lbl.textContent=text;
    /* treat index-0 empty-value options as placeholders */
    lbl.classList.toggle('is-ph',idx===0&&(!opt.value||opt.value===''));
  } else {
    lbl.textContent='Select\u2026';
    lbl.classList.add('is-ph');
  }
  wrap._last=sel.value;
}

function wrapSelect(sel){
  if(wrapped.has(sel))return;
  if(sel.hasAttribute('data-rzr-skip'))return;
  if(sel.size&&sel.size>1)return;
  wrapped.add(sel);

  /* mark parent to suppress ::after chevrons */
  if(sel.parentElement)sel.parentElement.classList.add('rzr-wrap-parent');

  /* hide native */
  sel.style.cssText='position:absolute!important;opacity:0!important;pointer-events:none!important;width:0!important;height:0!important;overflow:hidden!important;top:0!important;left:0!important;z-index:-1!important;border:none!important;padding:0!important;margin:0!important;';

  /* hide sibling fake-chevron divs */
  var sib=sel.nextElementSibling;
  if(sib&&sib.classList&&(sib.classList.contains('pointer-events-none')||sib.classList.contains('select-arrow')))sib.style.display='none';

  /* trigger */
  var t=document.createElement('div');
  t.className='rzr-trigger';
  t.setAttribute('tabindex','0');
  t.setAttribute('role','combobox');
  t.setAttribute('aria-haspopup','listbox');
  t.setAttribute('aria-expanded','false');
  var lb=document.createElement('span');lb.className='rzr-label is-ph';lb.textContent='Select\u2026';
  var cv=document.createElement('span');cv.className='rzr-chev';cv.innerHTML=CHEV;
  t.appendChild(lb);t.appendChild(cv);

  /* panel — will be moved to body on open */
  var p=document.createElement('div');p.className='rzr-panel';p.style.display='none';
  var sw=document.createElement('div');sw.className='rzr-panel-search';
  var si=document.createElement('input');si.className='rzr-search-inp';si.type='text';si.placeholder='Search\u2026';si.autocomplete='off';si.spellcheck=false;
  sw.appendChild(si);
  var l=document.createElement('div');l.className='rzr-list';l.setAttribute('role','listbox');
  p.appendChild(sw);p.appendChild(l);

  /* outer wrap */
  var w=document.createElement('div');w.className='rzr-wrap';
  w._s=sel;w._t=t;w._p=p;w._sw=sw;w._si=si;w._lb=lb;w._l=l;w._last=sel.value;

  w.appendChild(t);
  /* panel stays in wrap until open — moved to body on open() */
  w.appendChild(p);
  sel.parentNode.insertBefore(w,sel);
  w.appendChild(sel);

  /* search */
  si.addEventListener('input',function(){buildList(w,si.value);});
  si.addEventListener('keydown',function(e){if(e.key==='Escape'){close_(w);t.focus();}});

  /* trigger events */
  t.addEventListener('click',function(e){
    e.stopPropagation();
    openWrap===w?close_(w):open_(w);
  });
  t.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();openWrap===w?close_(w):open_(w);}
    if(e.key==='Escape')close_(w);
  });

  /* watch option changes (async population: channels, roles) */
  var mo=new MutationObserver(function(){
    updateLabel(w);
    if(openWrap===w){buildList(w,si.value);requestAnimationFrame(function(){positionPanel(w);});}
  });
  mo.observe(sel,{childList:true,subtree:true,characterData:true,attributes:true});

  /* poll for programmatic .value changes */
  var pid=setInterval(function(){
    if(!document.contains(sel)){clearInterval(pid);mo.disconnect();if(openWrap===w)close_(w);return;}
    if(sel.value!==w._last)updateLabel(w);
  },150);

  updateLabel(w);
}

function initAll(){document.querySelectorAll('select').forEach(wrapSelect);}

new MutationObserver(function(ms){
  ms.forEach(function(m){
    m.addedNodes.forEach(function(n){
      if(n.nodeType!==1)return;
      if(n.tagName==='SELECT')wrapSelect(n);
      else if(n.querySelectorAll)n.querySelectorAll('select').forEach(wrapSelect);
    });
  });
}).observe(document.body,{childList:true,subtree:true});

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initAll);
else initAll();
})();
</script>
<!-- End Razor Custom Select JS -->
