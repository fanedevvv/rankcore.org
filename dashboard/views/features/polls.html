<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polls</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tailwind.css">
<style>
* { box-sizing: border-box; }
body { font-family: 'Plus Jakarta Sans', sans-serif; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #0C0E1D; }
::-webkit-scrollbar-thumb { background: #2d2d3d; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #8B5CF6; }

#toast {
  position: fixed; top: 1rem; right: 1rem; z-index: 100;
  padding: .8rem 1.4rem; border-radius: .75rem; font-weight: 600; font-size: .875rem;
  color: white; transform: translateX(440px); transition: transform .3s ease; pointer-events: none;
}

.card {
  background: #13131f; border: 1px solid rgba(255,255,255,0.06);
  border-radius: 1rem; padding: 1.5rem;
}

.poll-card {
  background: #0e0e1a; border: 1px solid rgba(255,255,255,0.06);
  border-radius: 1rem; padding: 1.25rem;
  transition: border-color .15s, transform .15s;
}
.poll-card:hover { border-color: rgba(139,92,246,.2); transform: translateY(-1px); }

.badge {
  display: inline-flex; align-items: center; gap: .3rem;
  padding: .2rem .65rem; border-radius: .4rem; font-size: .7rem; font-weight: 700;
}
.badge-live   { background: rgba(139,92,246,.1);  border: 1px solid rgba(139,92,246,.3);  color: #8B5CF6; }
.badge-ended  { background: rgba(107,114,128,.1); border: 1px solid rgba(107,114,128,.2); color: #9ca3af; }
.badge-multi  { background: rgba(139,92,246,.1);  border: 1px solid rgba(139,92,246,.3);  color: #a78bfa; }

.vote-bar-track {
  height: 6px; background: rgba(255,255,255,0.07); border-radius: 999px; overflow: hidden; margin-top: 6px;
}
.vote-bar-fill { height: 100%; border-radius: 999px; transition: width .4s ease; }

.btn {
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .5rem 1rem; border-radius: .6rem; font-weight: 600; font-size: .85rem;
  cursor: pointer; transition: all .15s; border: none; outline: none;
}
.btn-primary { background: #8B5CF6; color: #050c07; }
.btn-primary:hover { background: #7C3AED; }
.btn-ghost { background: transparent; color: #9ca3af; border: 1px solid rgba(255,255,255,0.08); }
.btn-ghost:hover { background: rgba(255,255,255,0.04); color: white; }
.btn-danger { background: rgba(239,68,68,.1); color: #ef4444; border: 1px solid rgba(239,68,68,.2); }
.btn-danger:hover { background: rgba(239,68,68,.2); }

.empty-state { text-align: center; padding: 3rem 1rem; color: #4b5563; }

.countdown { font-family: 'JetBrains Mono', monospace; font-size: .75rem; color: #fbbf24; }

.tabs { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
.tab { padding: .45rem 1rem; border-radius: .6rem; font-weight: 600; font-size: .85rem; cursor: pointer; border: 1px solid transparent; color: #6b7280; transition: all .15s; }
.tab.active { background: rgba(139,92,246,.1); border-color: rgba(139,92,246,.3); color: #8B5CF6; }
.tab:not(.active):hover { background: rgba(255,255,255,.04); color: #9ca3af; }
</style>

  <link rel="stylesheet" href="/loading.css">
  <style>
    @keyframes nx-spin     { to { transform: translate(-50%,-50%) rotate(360deg); } }
    @keyframes nx-bar-move { 0%{margin-left:-40%} 100%{margin-left:140%} }
    @keyframes nx-pulse    { 0%,100%{box-shadow:0 0 0 0 rgba(139,92,246,0)} 50%{box-shadow:0 0 0 8px rgba(139,92,246,.08)} }
    @keyframes nx-dot      { 0%,80%,100%{transform:scale(.6);opacity:.4} 40%{transform:scale(1.2);opacity:1} }
  </style>
  <link rel="stylesheet" href="/mobile.css?v=2">
</head>
<body class="bg-[#0C0E1D] text-white min-h-screen flex">
<div id="nx-loader" style="position:fixed;inset:0;z-index:999999;background:#070813;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .35s ease,visibility .35s ease">
  <div style="position:fixed;top:0;left:0;right:0;height:3px;background:rgba(139,92,246,.1)"><div style="height:100%;width:40%;background:linear-gradient(90deg,#38D4FF,#8B5CF6,#E05CFF);animation:nx-bar-move 1.4s ease-in-out infinite;border-radius:0 2px 2px 0"></div></div>
  <div style="position:relative;width:80px;height:80px;display:flex;align-items:center;justify-content:center">
    <div style="width:50px;height:50px;border-radius:14px;background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.2);display:flex;align-items:center;justify-content:center;animation:nx-pulse 2s ease-in-out infinite">
      <img src="/logo.png" style="width:28px;height:28px;object-fit:contain" onerror="this.style.display='none'">
    </div>
    <div style="position:absolute;top:50%;left:50%;width:50px;height:50px;border-radius:50%;border:3px solid rgba(139,92,246,.12);border-top-color:#8B5CF6;animation:nx-spin .75s linear infinite;transform:translate(-50%,-50%)"></div>
  </div>
  <div style="font-size:12px;font-weight:600;letter-spacing:.04em;color:rgba(255,255,255,.25);font-family:system-ui,sans-serif;display:flex;align-items:center">Loading<span style="display:inline-flex;gap:2px;margin-left:3px"><span style="width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.25);animation:nx-dot 1.2s ease-in-out infinite;display:inline-block"></span><span style="width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.25);animation:nx-dot 1.2s ease-in-out .15s infinite;display:inline-block"></span><span style="width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.25);animation:nx-dot 1.2s ease-in-out .3s infinite;display:inline-block"></span></span></div>
</div>
<script>
  (function(){
    function hide(){var l=document.getElementById('nx-loader');if(!l)return;l.style.opacity='0';l.style.visibility='hidden';setTimeout(function(){if(l.parentNode)l.parentNode.removeChild(l);},300);}
    if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){setTimeout(hide,80);});}else{setTimeout(hide,80);}
    setTimeout(hide, 1500);
  })();
</script>
<script src="/loading.js" defer></script>


<aside id="razor-sidebar"></aside>
<div id="toast"></div>

<div class="ml-64 flex-1 p-8">

  <!-- Header -->
  <div class="mb-8 flex items-start justify-between">
    <div class="flex items-center gap-4">
      <div class="w-12 h-12 rounded-2xl bg-violet-500/10 border border-violet-500/20 flex items-center justify-center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6"  y1="20" x2="6"  y2="14"/>
        </svg>
      </div>
      <div>
        <h1 class="text-2xl font-bold">Polls</h1>
        <p class="text-sm text-gray-400 mt-0.5">View active and past community polls with live vote breakdowns.</p>
      </div>
    </div>
    <button class="btn btn-ghost" onclick="loadPolls()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.29"/></svg>
      Refresh
    </button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" id="tab-live" onclick="switchTab('live')">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" class="inline mr-1"><circle cx="12" cy="12" r="10"/></svg>
      Live
    </div>
    <div class="tab" id="tab-ended" onclick="switchTab('ended')">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="inline mr-1"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Ended
    </div>
    <div class="tab" id="tab-all" onclick="switchTab('all')">
      All Polls
    </div>
  </div>

  <!-- Stats -->
  <div class="grid grid-cols-3 gap-4 mb-6">
    <div class="card text-center">
      <p class="text-2xl font-bold text-[#8B5CF6]" id="stat-live">—</p>
      <p class="text-xs text-gray-400 mt-1">Live Polls</p>
    </div>
    <div class="card text-center">
      <p class="text-2xl font-bold text-gray-400" id="stat-ended">—</p>
      <p class="text-xs text-gray-400 mt-1">Ended</p>
    </div>
    <div class="card text-center">
      <p class="text-2xl font-bold text-violet-400" id="stat-votes">—</p>
      <p class="text-xs text-gray-400 mt-1">Total Votes Cast</p>
    </div>
  </div>

  <!-- Poll grid -->
  <div id="pollGrid" class="grid grid-cols-1 gap-4">
    <div class="empty-state card">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="1.5" class="mx-auto mb-3">
        <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      <p class="text-sm">Loading polls…</p>
    </div>
  </div>
</div>

<script src="/sidebar.js"></script>
<script>
const guildId = location.pathname.split('/')[2];
let allPolls  = [];
let activeTab = 'live';
const COLOURS = ['#8B5CF6','#a78bfa','#fbbf24','#f97316','#ef4444','#60a5fa'];

function showToast(msg, ok = true) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = ok ? '#8B5CF6' : '#ef4444';
  t.style.color = ok ? '#050c07' : 'white';
  t.style.transform = 'translateX(0)';
  setTimeout(() => t.style.transform = 'translateX(440px)', 3000);
}

function switchTab(tab) {
  activeTab = tab;
  ['live','ended','all'].forEach(t => {
    document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
  });
  renderPolls();
}

async function loadPolls() {
  try {
    const r = await fetch(`/api/guild/${guildId}/polls`);
    allPolls = await r.json();
    updateStats();
    renderPolls();
  } catch { showToast('Failed to load polls', false); }
}

function updateStats() {
  const now  = Date.now() / 1000;
  const live = allPolls.filter(p => p.EndTs > now || !p.EndTs);
  const votes = allPolls.reduce((acc, p) => {
    const v = p.Votes || {};
    return acc + Object.values(v).reduce((s, arr) => s + (Array.isArray(arr) ? arr.length : 0), 0);
  }, 0);
  document.getElementById('stat-live').textContent   = live.length;
  document.getElementById('stat-ended').textContent  = allPolls.length - live.length;
  document.getElementById('stat-votes').textContent  = votes;
}

function visiblePolls() {
  const now = Date.now() / 1000;
  if (activeTab === 'live')  return allPolls.filter(p => p.EndTs > now || !p.EndTs);
  if (activeTab === 'ended') return allPolls.filter(p => p.EndTs && p.EndTs <= now);
  return allPolls;
}

function renderPolls() {
  const polls = visiblePolls();
  const grid  = document.getElementById('pollGrid');

  if (!polls.length) {
    grid.innerHTML = `<div class="empty-state card">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="1.5" class="mx-auto mb-3">
        <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      <p class="text-sm">No polls in this category.</p>
    </div>`;
    return;
  }

  grid.innerHTML = polls.map(p => buildPollCard(p)).join('');
  startCountdowns();
}

function buildPollCard(p) {
  const now     = Date.now() / 1000;
  const isLive  = !p.EndTs || p.EndTs > now;
  const votes   = p.Votes || {};
  const answers = p.Answers || [];

  const totalVotes = Object.values(votes).reduce((s, arr) => s + (Array.isArray(arr) ? arr.length : 0), 0);

  const bars = answers.map((ans, i) => {
    const count = Array.isArray(votes[String(i)]) ? votes[String(i)].length : 0;
    const pct   = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
    const colour = COLOURS[i % COLOURS.length];
    return `<div class="mb-2">
      <div class="flex justify-between text-xs text-gray-400 mb-1">
        <span>${escapeHtml(String(ans))}</span>
        <span style="color:${colour}">${count} vote${count!==1?'s':''} &bull; ${pct}%</span>
      </div>
      <div class="vote-bar-track">
        <div class="vote-bar-fill" style="width:${pct}%;background:${colour}"></div>
      </div>
    </div>`;
  }).join('');

  const timeLeft = p.EndTs && isLive
    ? `<span class="countdown" data-end="${p.EndTs}">calculating…</span>`
    : p.EndTs ? `<span class="text-xs text-gray-500">Ended ${new Date(p.EndTs*1000).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}</span>` : '';

  return `<div class="poll-card">
    <div class="flex items-start justify-between gap-3 mb-4">
      <div class="flex-1 min-w-0">
        <p class="font-semibold text-base leading-snug mb-1">${escapeHtml(p.Question || 'Untitled Poll')}</p>
        <div class="flex items-center gap-2 flex-wrap">
          <span class="badge ${isLive ? 'badge-live' : 'badge-ended'}">${isLive ? 'Live' : 'Ended'}</span>
          ${p.AllowMultiSelect ? `<span class="badge badge-multi">Multi-choice</span>` : ''}
          <span class="text-xs text-gray-500">by ${escapeHtml(p.AuthorTag || p.Author || 'Unknown')}</span>
        </div>
      </div>
      <div class="text-right flex-shrink-0">
        <p class="text-lg font-bold">${totalVotes}</p>
        <p class="text-xs text-gray-500">votes</p>
      </div>
    </div>
    <div class="mb-3">${bars}</div>
    <div class="flex items-center justify-between mt-3 pt-3 border-t border-white/5">
      <div>${timeLeft}</div>
      ${isLive ? `<button class="btn btn-danger" style="padding:.35rem .8rem;font-size:.78rem" onclick="endPoll('${escapeHtml(p.Message || '')}')">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
        End Poll
      </button>` : ''}
    </div>
  </div>`;
}

function startCountdowns() {
  document.querySelectorAll('.countdown[data-end]').forEach(el => {
    function tick() {
      const end  = parseInt(el.dataset.end);
      const diff = end - Math.floor(Date.now()/1000);
      if (diff <= 0) { el.textContent = 'Ending…'; return; }
      const h = Math.floor(diff/3600);
      const m = Math.floor((diff%3600)/60);
      const s = diff % 60;
      el.textContent = h > 0 ? `${h}h ${m}m ${s}s remaining` : m > 0 ? `${m}m ${s}s remaining` : `${s}s remaining`;
      setTimeout(tick, 1000);
    }
    tick();
  });
}

async function endPoll(messageId) {
  if (!messageId || !confirm('End this poll early?')) return;
  try {
    const r = await fetch(`/api/guild/${guildId}/polls/${messageId}/end`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': document.querySelector('meta[name="csrf-token"]')?.content || '' },
    });
    if (!r.ok) throw new Error();
    showToast('Poll ended');
    loadPolls();
  } catch { showToast('Failed to end poll', false); }
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

loadPolls();
</script>

</body>
</html>
