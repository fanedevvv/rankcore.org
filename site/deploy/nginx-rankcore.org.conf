# RankCore — public website (React SPA) + dashboard (Docker, port 25566)
# Website files: /var/www/rankcore.org-site  (built + published by scripts/deploy-site.sh in the bot repo)
# Based on the old rocobot.xyz config (archived in /root/rocobot-archive-20261104.tar.gz).

upstream rankcore_dashboard {
    server 2.26.218.80:25566;
    keepalive 16;
}

# ── rankcore.org / www.rankcore.org ─────────────────────────────
server {
    server_name rankcore.org www.rankcore.org;
    include snippets/maintenance.conf;
    include /etc/nginx/snippets/rocobot-cloudflare-realip.conf;

    root /var/www/rankcore.org-site;
    index index.html;

    # Dashboard-only paths that people may still open on the main domain
    location ~ ^/(guild/|apply/|ipverify/|webhooks/|(servers|login|logout|callback|welcome|dev|invite|support|changelogs|gdpr|subscriptions|donate|blacklisted|disabled|tos|premium403|premium/branding)/?$) {
        return 301 https://dash.rankcore.org$request_uri;
    }

    # Live data for the site — the dashboard forwards /api/site/* to the bot
    location /api/site/ {
        proxy_http_version 1.1;
        proxy_pass http://rankcore_dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 15s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) { deny all; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rankcore.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rankcore.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

# ── dash.rankcore.org ───────────────────────────────────────────
server {
    server_name dash.rankcore.org;
    include snippets/maintenance.conf;
    include /etc/nginx/snippets/rocobot-cloudflare-realip.conf;

    client_max_body_size 12m;

    location / {
        proxy_pass http://2.26.218.80:25566;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    location ~ /\.(?!well-known) { deny all; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rankcore.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rankcore.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = www.rankcore.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = rankcore.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name rankcore.org www.rankcore.org;
    return 404; # managed by Certbot




}
server {
    if ($host = dash.rankcore.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name dash.rankcore.org;
    return 404; # managed by Certbot


}